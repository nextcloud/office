name: Playwright

on: pull_request

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    name: Playwright e2e

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6baf7d8f41934ab630e97d9e6c0bc9c9ac5e4 # v3
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies & build app
        run: |
          npm ci
          npm run build

      # Server master dropped the bundled Viewer app (nextcloud/server#63954);
      # until a release supports @nextcloud/viewer, test against the PR that does.
      - name: Build richdocuments with @nextcloud/viewer support
        env:
          # nextcloud/richdocuments#6142 (fix/6060-nextcloud-viewer-v2)
          RICHDOCUMENTS_SHA: e101e6b3266cdb37e570137733bada08ca3f34af
        run: |
          git init -q "$RUNNER_TEMP/richdocuments"
          cd "$RUNNER_TEMP/richdocuments"
          git fetch -q --depth=1 https://github.com/nextcloud/richdocuments.git "$RICHDOCUMENTS_SHA"
          git checkout -q FETCH_HEAD
          composer install --no-dev
          npm ci
          npm run build
          echo "RICHDOCUMENTS_PATH=$RUNNER_TEMP/richdocuments" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEXTCLOUD_E2E_LOG_FILE: test-results/nextcloud.log

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: playwright

    if: always()

    name: playwright-summary

    steps:
      - name: Summary status
        run: if ${{ needs.playwright.result != 'success' }}; then exit 1; fi
